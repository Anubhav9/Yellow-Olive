apiVersion: apps/v1
kind: Deployment
metadata:
  name: customs-stable
  namespace: sakura-harbour
  labels:
    app: customs-lane
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: customs-lane
      track: stable
  template:
    metadata:
      labels:
        app: customs-lane
        track: stable
    spec:
      containers:
        - name: customs-stable
          image: nginx:1.25
          ports:
            - containerPort: 80
