<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Challenges · Hosted Labs</title>
    <style>
      :root {
        --bg: #1a1a2e;
        --text: #eaeaea;
        --accent: #f4d35e;
        --border: #2d3a4f;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        background: var(--bg);
        color: var(--text);
        padding: 2.5rem 1.25rem;
      }

      main {
        max-width: 36rem;
        margin: 0 auto;
      }

      h1 {
        margin-top: 0;
      }

      ul {
        list-style: none;
        padding: 0;
      }

      li + li {
        margin-top: 0.75rem;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hosted Challenges</h1>
      <ul>
        {% for challenge in challenges %}
        <li><a href="/challenges/{{ challenge.slug }}">{{ challenge.title }}</a></li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
