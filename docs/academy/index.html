<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yellow Olive Academy</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1a1a1a;

    <div id="pyxel-screen"><p id="loading">BOOTING YELLOW OLIVE ACADEMY...</p></div>
