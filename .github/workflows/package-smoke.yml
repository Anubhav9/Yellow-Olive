name: Package smoke test

on:
  pull_request:
  push:

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build "twine>=6" pytest pytest-asyncio

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distributions with twine
        run: python -m twine check dist/*

      - name: Install wheel into clean venv
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install dist/*.whl
          .ci-venv/bin/pip install pytest pytest-asyncio

      - name: Run installed-package smoke tests
        run: .ci-venv/bin/pytest tests/test_package_smoke.py -v -o asyncio_mode=auto
